<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orçamentos de Alianças</title>
<style>
:root{
  --ink:#0f172a; --charcoal:#1f2937; --gold:#2563eb; --gold-dark:#1d4ed8; --gold-light:#3b82f6;
  --cream:#eef1f7; --ivory:#ffffff; --soft:#e5edff; --line:#e6e8f0; --muted:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(170deg,#fbfcff 0%,#eaeefb 100%);background-attachment:fixed;color:var(--charcoal);font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px}
h1,h2,h3,.serif{font-family:inherit;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
em{font-style:normal;color:var(--gold)}
.muted{color:var(--muted)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.container{max-width:1120px;margin:0 auto;padding:22px 20px}
.gold-grad{background:linear-gradient(135deg,#3b82f6,#2563eb 90%)}
.card{background:var(--ivory);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px -14px rgba(30,41,59,.18)}
.pad{padding:20px}
.center{text-align:center}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gap{gap:10px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.prodwrap{grid-template-columns:1fr!important}.quotewrap{grid-template-columns:1fr!important}}
@media(max-width:620px){.g2{grid-template-columns:1fr}.container{padding:16px 14px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;transition:.15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{color:#fff;box-shadow:0 8px 20px -10px rgba(37,99,235,.6)}.btn-primary.gold-grad:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--charcoal)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-dark)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#0b1220}
.btn-white{background:#fff;color:var(--gold-dark)}.btn-white:hover{filter:brightness(.97)}
.btn-subtle{background:var(--cream);color:var(--charcoal)}.btn-subtle:hover{background:var(--soft)}
.btn-sm{padding:7px 12px;font-size:13px}
.w100{width:100%}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--gold-dark)}
.badge.green{background:#dcfce7;color:#15803d}.badge.blue{background:#e0edff;color:#1d4ed8}.badge.amber{background:#fef3c7;color:#b45309}
.badge.red{background:#fee2e2;color:#b91c1c}.badge.gray{background:#eef1f6;color:#475569}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;background:#fff;font-family:inherit;color:var(--charcoal)}
.inp:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.field{display:block;margin-bottom:2px}
.field .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field .val{margin-top:4px}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.85);color:var(--ink);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1120px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;color:var(--ink)}
.brand-badge{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb)}
.brand-name{font-weight:800;font-size:20px;letter-spacing:-.01em}
.search-wrap{position:relative;flex:1;max-width:440px}
.search{width:100%;border-radius:12px;background:#f1f4fa;border:1px solid var(--line);padding:9px 14px;color:var(--ink);font-size:14px}
.search::placeholder{color:#94a3b8}
.search:focus{outline:0;background:#fff;border-color:var(--gold);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-drop{position:absolute;top:44px;left:0;right:0;background:#fff;color:var(--charcoal);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 34px -10px rgba(15,23,42,.25);overflow:hidden;z-index:50}
.search-drop button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 12px;text-align:left}
.search-drop button:hover{background:var(--cream)}
.nav{display:flex;gap:2px;margin-left:auto}
.navbtn{background:none;border:0;color:#475569;padding:7px 11px;border-radius:9px;font-size:14px;font-weight:500}
.navbtn:hover{background:var(--cream);color:var(--ink)}
.cartbtn{position:relative;background:#f1f4fa;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:14px}
.cartbtn:hover{border-color:var(--gold)}
.cart-badge{position:absolute;top:-8px;right:-8px;background:var(--gold);color:#fff;font-size:11px;width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.top-sub{max-width:1120px;margin:0 auto;padding:0 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rate{background:none;border:0;color:inherit;display:flex;align-items:center;gap:8px}
.rate:hover{color:var(--gold)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block}.dot.green{background:#22c55e}.dot.amber{background:#f59e0b}
.hero{text-align:center;padding:26px 0}
.eyebrow{color:var(--gold);letter-spacing:.28em;font-size:11px;font-weight:700}
.hero-title{font-size:42px;margin-top:8px;font-weight:800}
.launch{margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.launch{grid-template-columns:repeat(2,1fr)}}
.lcard{background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 10px 28px -18px rgba(30,41,59,.22);transition:.16s}
.lcard:hover{transform:translateY(-4px);border-color:#c9d6f5;box-shadow:0 18px 34px -20px rgba(37,99,235,.4)}
.licon{width:52px;height:52px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.shelf .mini{flex:0 0 auto;width:160px;background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.shelf .mini:hover{border-color:var(--gold)}
.code{font-size:12px;color:var(--gold-dark);font-weight:700;letter-spacing:.02em}
.tabs{display:inline-flex;background:#e9edf6;border-radius:12px;padding:4px;flex-wrap:wrap}
.tab{background:none;border:0;padding:9px 15px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.tab.on{background:#fff;color:var(--gold-dark);box-shadow:0 4px 12px -6px rgba(30,41,59,.25)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.catgrid{grid-template-columns:repeat(2,1fr)}}
.prod{background:var(--ivory);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 26px -18px rgba(30,41,59,.22);transition:.15s}
.prod:hover{border-color:#c9d6f5}
.prod .ph{position:relative;background:linear-gradient(#f4f7fd,#fff);display:flex;justify-content:center;align-items:center;padding:18px 0;cursor:pointer;min-height:150px}
.fav{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.7);border:0;font-size:18px;color:#f59e0b;border-radius:999px;width:30px;height:30px}
.prodwrap{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.optrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.12s}
.optrow.on{border-color:var(--gold);background:var(--soft)}
.optrow .nm{flex:1;font-size:14px}
.optrow .pr{font-weight:700;color:var(--gold-dark);font-size:14px}
.pricebox{margin-top:16px;border-radius:18px;padding:20px;color:#fff;box-shadow:0 16px 32px -18px rgba(37,99,235,.55)}
.price-big{font-weight:800;font-size:38px;letter-spacing:-.02em}
.warn{margin-top:12px;font-size:11px;background:rgba(0,0,0,.18);border-radius:9px;padding:6px 10px}
.cmpcard{background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px -18px rgba(30,41,59,.22)}
.cmprow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.cmprow:last-child{border:0}
.quotewrap{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.qitem{background:var(--ivory);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;color:var(--muted);margin:3px 0}
.sumrow.st{color:var(--ink);font-weight:700;font-size:16px}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.listrow:last-child{border:0}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;width:100%;max-width:540px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px -12px rgba(15,23,42,.35)}
.modal.wide{max-width:780px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.x{background:none;border:0;font-size:20px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -8px rgba(15,23,42,.4)}
.stat{background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:18px}
.stat .n{font-weight:800;font-size:30px;color:var(--ink);margin-top:4px}
.paramrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.paramrow .pl{flex:1;font-size:14px;color:var(--ink)}
.hint{font-size:11px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border:0}
.pimg{object-fit:cover;border-radius:14px;background:#f4f7fd}
.print-area{max-width:780px;margin:22px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 16px 44px -16px rgba(15,23,42,.3)}
.pdf-head{padding:24px 40px;color:var(--ink);background:#eef1f6;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.pdf-head .muted2{color:#6b7280}
.pdf-body{padding:24px 40px}
.print-bar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:10}
.print-bar .inner{max-width:780px;margin:0 auto;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media print{@page{margin:0}.no-print{display:none!important}html,body{background:#fff!important;background-image:none!important}.print-area{box-shadow:none;margin:0}.pdf-body{padding:20px 26px}}
.divider{border-top:1px solid var(--line)}
/* ---- Responsivo do topo (por último, para vencer as regras base) ---- */
@media(max-width:620px){
  .top-inner{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
  .brand-name{font-size:17px}
  .search-wrap{order:5;flex:1 1 100%;max-width:none}
  .nav{order:6;flex:1 1 100%;flex-wrap:nowrap;gap:5px;justify-content:space-between;overflow-x:auto;padding-bottom:2px}
  .navbtn{padding:6px 8px;font-size:11.5px;white-space:nowrap;border:1px solid var(--line);background:#f1f4fa;border-radius:9px;color:var(--ink);flex:1 1 auto;text-align:center}
  .cartbtn{margin-left:auto;padding:7px 11px}
  .top-sub{padding:6px 12px 8px}
  .print-bar .inner{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
  .print-bar .inner .btn{width:100%;margin:0!important;font-size:12px;padding:9px 6px}
  .print-bar .inner #btnWa{grid-column:1/-1}
}
</style>
</head>

</script>

/* Par = índice(karat) × cotação do ouro × 2 + dist × (pedra US$ × dólar).  dist ∈ {0,1,2} */
function priceOf(model, matId, dist){
  var mat=MAT_BY[matId]; var falta=[];
  var indice = mat.karat==='10k'? model.indice10k : model.indice18k;
  if(state.rates.ouro==null) falta.push('cotação do ouro');
  if(indice==null||indice==='') falta.push('índice '+mat.karat);
  var goldPair=(indice||0)*(state.rates.ouro||0)*2;
  var stoneUSD = mat.pedra==='Brilhante'? model.brilhanteUSD : model.zirconiaUSD;
  if(dist>0){ if(stoneUSD==null||stoneUSD==='') falta.push('valor da pedra ('+(mat.pedra||'pedra')+')'); if(state.rates.dolar==null) falta.push('cotação do dólar'); }
  var stones=dist*((stoneUSD||0)*(state.rates.dolar||0));
  var par=goldPair+stones;
  return { mat:mat, indice:indice, goldPair:goldPair, stones:stones, par:par, total:par,
    pesoPar:(mat.karat==='10k'? model.pesoAu416 : model.pesoAu750)*2, falta:falta };
}
function valorModo(par,modo){ return modo==='unit'? par/2 : par; }
function currentCalc(){ var m=getModel(state.activeModelId); if(!m) return null; var c=priceOf(m,state.sel.matId,state.sel.dist); c.valor=valorModo(c.par,state.sel.modo); return c; }
function hasStone(m){ return (m.zirconiaUSD!=null&&m.zirconiaUSD!=='')||(m.brilhanteUSD!=null&&m.brilhanteUSD!==''); }
function availMats(m){ var hasZ=(m.zirconiaUSD!=null&&m.zirconiaUSD!==''), hasB=(m.brilhanteUSD!=null&&m.brilhanteUSD!==''); var list=[]; if(hasZ){ list.push(MAT_BY['10kz']); list.push(MAT_BY['18kz']); } if(hasB){ list.push(MAT_BY['18kb']); } if(!hasZ&&!hasB){ list.push(MAT_BY['10k']); list.push(MAT_BY['18k']); } return list; }
function basePrice(m){ var a=availMats(m); return priceOf(m,a[0].id,0).total; }
function catBase(m){ if((m.tipo||'alianca')==='formatura'){ var r=state.rates; return (m.indice10k||0)*(r.ouro||0)+(m.zirconiaUSD||0)*(r.dolar||0); } return basePrice(m); }

function pbSubtotal(){ return state.cart.reduce(function(s,i){return s+i.total;},0); }
function pbCalc(){
  var total=pbSubtotal(), f=state.pb.forma;
  if(f==='pago') return {total:total, pago:total, falta:0, label:'Pago', como:'', pagamentos:[]};
  if(f==='parcial'){ var pgs=state.pb.pagamentos||[]; var pago=pgs.reduce(function(s,p){return s+(+p.valor||0);},0); var como=pgs.filter(function(p){return +p.valor>0;}).map(function(p){return money(+p.valor||0)+(p.forma?(' '+p.forma):'');}).join(' + '); return {total:total, pago:pago, falta:Math.max(0,total-pago), label:'Pago parcialmente', como:como, pagamentos:JSON.parse(JSON.stringify(pgs))}; }
  return {total:total, pago:0, falta:total, label:'Acertar na retirada', como:'', pagamentos:[]};
}

function fornecedorMsg(o){
  var L=['*Pedido para produção — '+state.store.nome+'*','Ref: '+o.numero,''];
  o.itens.forEach(function(it){ var m=getModel(it.modelId);
    if(it.tipo==='formatura'){
      var karatF=it.karat==='10k'?'Ouro 10k':'Ouro 18k';
      var pedraF=(it.pedraMode==='natural'?'Pedra Natural ':'Pedra Sintética ')+(it.pedra||'');
      L.push('Modelo: *'+m.modelo+'* (anel de formatura)');
      L.push('Material: *'+karatF+'*');
      L.push('*'+pedraF+'*');
      if(it.cursoNome) L.push('Curso: *'+it.cursoNome+'*'+(it.cursoSimbolo?(' — símbolo do curso: '+it.cursoSimbolo):''));
      L.push('Símbolo: *'+(it.simboloTipo==='diferente'?('diferente'+(it.simboloObs?(' — '+it.simboloObs):'')):'conforme catálogo')+'*');
      L.push('Formato do símbolo: *'+formatoLabel(it.simboloFormato)+'*');
      L.push('*Aro '+(it.aro1||'?')+'*');
      L.push('');
      return;
    }
    var karat = it.karat==='10k'?'Ouro 10k':'Ouro 18k';
    var stLabel = it.pedra ? (it.pedra+(it.pedra==='Brilhante'&&it.pontos?' '+it.pontos+'pts':'')) : null;
    var aroLine = function(aro,com){ return '*Aro '+(aro||'?')+(com?(' com '+stLabel):' sem pedra')+'*'; };
    L.push('Modelo: *'+m.modelo+'*');
    L.push('Material: *'+karat+'*');
    L.push('Aros:');
    if(it.modo==='unit'){
      L.push(aroLine(it.aro1, (it.dist>0&&stLabel), it.grav1));
    } else {
      var a1,a2;
      if(!stLabel||it.dist===0){ a1=false; a2=false; }
      else if(it.dist===2){ a1=true; a2=true; }
      else { a1=(it.pedraAro!==2); a2=(it.pedraAro===2); }
      L.push(aroLine(it.aro1, a1, it.grav1));
      L.push(aroLine(it.aro2, a2, it.grav2));
    }
    L.push('');
  });
  if(o.obs) L.push('Obs.: '+o.obs);
  L.push('Cliente precisa até: '+fmtDate(o.dataPromessa));
  return L.join('\n');
}

function _impNum(s){ if(s==null||s==='') return null; s=String(s).replace(/[^\d.,]/g,''); if(!s) return null; s=s.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'); var n=parseFloat(s); return isNaN(n)?null:n; }
function importParseRows(rows){
  var models=[], cur=null;
  for(var i=0;i<rows.length;i++){
    var r=rows[i]||[]; var c0=(r[0]==null?'':String(r[0])).trim(); var c1=(r[1]==null?'':String(r[1])); var c2=(r[2]==null?'':String(r[2]));
    if(/^AL\s*\d+/i.test(c0) && /PESO/i.test(c1)){
      if(cur) models.push(cur);
      cur={ modelo:c0.replace(/\s+/g,'').toUpperCase(), peso750:_impNum((c1.match(/750:\s*([\d.,]+)/)||[])[1]), peso416:_impNum((c1.match(/416:\s*([\d.,]+)/)||[])[1]), larguraRaw:((c1.match(/LARGURA:\s*([\d.,]+)/i)||[])[1]||''), largura:_impNum((c1.match(/LARGURA:\s*([\d.,]+)/i)||[])[1]), obs:'', pontos:null };
    } else if(cur){
      if(/^obs/i.test(c0) && !cur.obs){ cur.obs=c0.replace(/^obs\.?:?\s*/i,'').trim(); }
      var mb=c2.match(/brilhante\s*([\d.,]+)\s*(pts|pnt)/i); if(mb && cur.pontos==null) cur.pontos=_impNum(mb[1]);
    }
  }
  if(cur) models.push(cur);

}

  var ra2=document.getElementById('rateAuto2'); if(ra2) ra2.onclick=function(){ state.rates.manualOuro=false; save(); toast('Voltando ao ouro automático…'); fetchRates(); };
  document.querySelectorAll('[data-store]').forEach(function(el){ el.oninput=function(){ var k=el.getAttribute('data-store'); state.store[k]= (el.type==='number')?(+el.value):el.value; }; });
  var vl=document.getElementById('vendList'); if(vl) vl.oninput=function(){ state.vendedoras=vl.value.split('\n').map(function(x){return x.trim();}).filter(function(x){return x;}); };
  document.querySelectorAll('[data-tmpl]').forEach(function(el){ el.oninput=function(){ var t=state.templates.filter(function(x){return x.id===el.getAttribute('data-tmpl');})[0]; if(t) t.texto=el.value; }; });
  function bindMEdits(){ document.querySelectorAll('[data-editmodel]').forEach(function(b){ b.onclick=function(){ openModelModal(b.getAttribute('data-editmodel')); }; }); }
  bindMEdits();
  var nm=document.getElementById('novoModelo'); if(nm) nm.onclick=function(){ openModelModal(null); };
  var im=document.getElementById('importModelos'); if(im) im.onclick=openImport;
  document.querySelectorAll('[data-cnome]').forEach(function(el){ el.oninput=function(){ var i=+el.getAttribute('data-cnome'); if(state.store.cursos[i]) state.store.cursos[i].nome=el.value; save(); }; });
  document.querySelectorAll('[data-csimb]').forEach(function(el){ el.oninput=function(){ var i=+el.getAttribute('data-csimb'); if(state.store.cursos[i]) state.store.cursos[i].simbolo=el.value; save(); }; });
  document.querySelectorAll('[data-ccor]').forEach(function(el){ el.oninput=function(){ var i=+el.getAttribute('data-ccor'); if(state.store.cursos[i]) state.store.cursos[i].cor=el.value; save(); }; });
  document.querySelectorAll('[data-crm]').forEach(function(b){ b.onclick=function(){ state.store.cursos.splice(+b.getAttribute('data-crm'),1); save(); render(); }; });
  var ca=document.getElementById('cursoAdd'); if(ca) ca.onclick=function(){ if(!state.store.cursos) state.store.cursos=[]; state.store.cursos.push({id:'c'+Date.now(),nome:'',simbolo:'',cor:''}); render(); };
  var ms=document.getElementById('mSearch'); if(ms) ms.oninput=function(){ state.mSearch=ms.value; var g=document.getElementById('mGrid'); if(g){ g.innerHTML=adminModelosCards(); bindMEdits(); } };
  var lg=document.getElementById('storeLogo'); if(lg) lg.onchange=function(){ var file=lg.files&&lg.files[0]; if(!file) return; var rd=new FileReader(); rd.onload=function(){ state.store.logo=rd.result; var pv=document.getElementById('storeLogoPrev'); if(pv){ pv.src=state.store.logo; pv.style.display='block'; } save(); toast('Logo atualizado.'); render(); }; rd.readAsDataURL(file); };
  var ld=document.getElementById('storeLogoDel'); if(ld) ld.onclick=function(){ state.store.logo=null; save(); render(); };
}
function bindPedidos(){ var t=document.getElementById('pedTipo'); if(t) t.onchange=function(){ state._foTipo=t.value; render(); }; }
function bindModelos(){
  document.querySelectorAll('[data-mtab]').forEach(function(b){ b.onclick=function(){ state.modelosTipo=b.getAttribute('data-mtab'); render(); }; });
  var tp=state.modelosTipo||'alianca';
  function bindMEdits(){ document.querySelectorAll('[data-editmodel]').forEach(function(b){ b.onclick=function(){ openModelModal(b.getAttribute('data-editmodel')); }; }); }
  bindMEdits();
  var nm=document.getElementById('novoModelo'); if(nm) nm.onclick=function(){ openModelModal(null, tp); };
  var im=document.getElementById('importModelos'); if(im) im.onclick=openImport;
  var ms=document.getElementById('mSearch'); if(ms) ms.oninput=function(){ state.mSearch=ms.value; var g=document.getElementById('mGrid'); if(g){ g.innerHTML=adminModelosCards(); bindMEdits(); g.querySelectorAll('[data-zoom]').forEach(function(el){ el.addEventListener('click',function(){ zoomImg(el.getAttribute('data-zoom')); }); }); } };
}
function bindPrint(){
  var bp=document.getElementById('btnPrint'); if(bp) bp.onclick=function(){ window.print(); };
  var bw=document.getElementById('btnWa'); if(bw) bw.onclick=function(){ copyText(waTextFor(getQuote(state.printQuoteNum))); toast('Mensagem copiada! Cole na conversa do cliente.'); };
}

/* ============================================================ START ============================================================ */
boot();
</script>
</body>
</html>
